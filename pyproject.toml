[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-artificial-brain"
version = "0.1.0"
description = "Phase 1 foundation for an experimental autonomous cognitive system"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2,<3",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["aab*"]
